<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhateverPad PS5</title>
<style>
:root {
  --bg: #08080a; --surface: #101014; --card: rgba(24,24,28,.88); --card2: #15151a; --line: rgba(255,255,255,.08);
  --text: #f4f6fb; --dim: #8e94a3; --accent: #ff8a00; --accent-glow: rgba(255,138,0,.40); --accent-ink: #ffd3a1; --teal: #2ee6a6;
  --ok: #3ddc84; --bad: #ff4d5e; --chip: rgba(255,138,0,.14);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--text); background: var(--bg);
  background-image: radial-gradient(900px 520px at 85% -10%, rgba(255,138,0,.14), rgba(0,0,0,0) 60%),
                    radial-gradient(700px 420px at -10% 110%, rgba(46,230,166,.07), rgba(0,0,0,0) 60%);
  font: 15px/1.45 Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.meta, .combo, .picked, td:first-child, #ver, #chip { unicode-bidi: plaintext; }
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
/* ---- side bar ---- */
.side { background: rgba(16,16,20,.92); border-inline-end: 1px solid var(--line); padding: 18px 14px;
  display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
.logo { width: 38px; height: 38px; display: grid; place-items: center; }
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand b { font-size: 18px; letter-spacing: .3px; } .brand b span { color: var(--accent); }
.brand small { display: block; color: var(--dim); font-size: 11px; direction: ltr; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; border: 0;
  background: transparent; color: #c9cdd6; padding: 11px 14px; border-radius: 12px; font: inherit;
  font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; cursor: pointer; }
.nav button svg { width: 19px; height: 19px; flex: none; opacity: .85; }
.nav button:hover, .nav button:focus { background: rgba(255,255,255,.05); outline: none; }
.nav button.on { background: var(--accent); color: #141414; box-shadow: 0 6px 22px var(--accent-glow); }
.side .grow { flex: 1; }
#status { align-self: flex-start; font-size: 12px; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
#status.on { border-color: rgba(61,220,132,.5); color: var(--ok); }
#status.off { border-color: rgba(255,77,94,.5); color: var(--bad); }
#chip { color: var(--dim); font-size: 11px; padding: 6px 4px 0; }
/* ---- content ---- */
main { padding: 26px 30px 40px; max-width: 1100px; width: 100%; }
.view[hidden] { display: none; }
h1.title { margin: 0 0 18px; font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
h1.title span { color: var(--accent); }
h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { color: var(--dim); font-size: 13px; }
button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text);
  padding: 9px 16px; border-radius: 12px; cursor: pointer; }
button:hover, button:focus { border-color: rgba(255,138,0,.65); outline: none; }
button.solid { background: var(--accent); border-color: var(--accent); color: #141414; font-weight: 700; box-shadow: 0 6px 20px var(--accent-glow); }
button.blue { background: #0070d1; border-color: #0070d1; color: #fff; font-weight: 700; }
button.danger { border-color: rgba(255,77,94,.55); color: var(--bad); background: rgba(255,77,94,.06); }
button:disabled { opacity: .45; cursor: default; box-shadow: none; }
/* ---- pairing: radar ---- */
.pairbox { display: grid; grid-template-columns: 240px 1fr; gap: 26px; align-items: center; }
.radar { position: relative; width: 230px; height: 230px; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 50%, rgba(46,230,166,.10), rgba(8,8,10,.6) 70%); border: 1px solid var(--line); }
.radar .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.09); }
.radar .r1 { inset: 18%; } .radar .r2 { inset: 34%; } .radar .r3 { inset: 6%; }
.radar .cross { position: absolute; inset: 0; background:
  linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)) 50% 0 / 1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)) 0 50% / 100% 1px no-repeat; }
.radar .sweep { position: absolute; inset: 0; border-radius: 50%; display: none;
  background: conic-gradient(from 0deg, rgba(46,230,166,0) 0deg, rgba(46,230,166,0) 290deg, rgba(46,230,166,.55) 360deg);
  animation: spin 2.4s linear infinite; }
.radar .pulse { position: absolute; inset: 40%; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; display: none; }
.radar .core { position: absolute; inset: 39%; border-radius: 50%; display: grid; place-items: center;
  background: #121217; border: 1px solid var(--line); color: var(--dim); }
.radar .core svg { width: 58%; height: 58%; }
.radar .blip { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
  background: var(--teal); box-shadow: 0 0 12px var(--teal); }
.radar[data-mode="search"] .sweep { display: block; }
.radar[data-mode="search"] .core { color: var(--teal); border-color: rgba(46,230,166,.45); }
.radar[data-mode="pause"] { background: radial-gradient(circle at 50% 50%, rgba(255,138,0,.22), rgba(8,8,10,.6) 70%); border-color: rgba(255,138,0,.55); }
.radar[data-mode="pause"] .pulse { display: block; animation: ping 1.8s ease-out infinite; }
.radar[data-mode="pause"] .core { color: #141414; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 26px var(--accent-glow); }
.radar[data-mode="fail"] { border-color: rgba(255,77,94,.5); background: radial-gradient(circle, rgba(255,77,94,.12), rgba(8,8,10,.6) 70%); }
.radar[data-mode="fail"] .core { color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 0% { inset: 40%; opacity: .9; } 100% { inset: 0%; opacity: 0; } }
.pairstate { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.pairstate.search { color: var(--teal); } .pairstate.pause { color: var(--accent); } .pairstate.fail { color: var(--bad); }
.prog { height: 8px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; margin: 14px 0 16px; }
.prog b { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--accent)); transition: width .9s linear; }
.prog.pause b { background: var(--accent); }
.prog[hidden] { display: none; }
/* ---- pads ---- */
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.pad { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card2); }
.pad .top { display: flex; align-items: center; gap: 10px; }
.pad .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); color: var(--accent); flex: none; }
.pad .ico svg { width: 22px; height: 22px; }
.pad .name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pad .slot { color: #141414; background: var(--accent); border-radius: 8px; padding: 1px 9px; font-size: 12px; font-weight: 800; }
.pad .meta { color: var(--dim); font-size: 12px; margin: 4px 0 12px; direction: ltr; }
.viz { display: flex; gap: 14px; align-items: center; justify-content: center; }
.stick { width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.10); position: relative; background: rgba(255,255,255,.02); }
.stick i { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.trig { width: 10px; height: 62px; border: 1px solid rgba(255,255,255,.10); border-radius: 5px; position: relative; overflow: hidden; }
.trig b { position: absolute; bottom: 0; left: 0; right: 0; background: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; min-height: 24px; }
.btns span { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--accent-ink); font-weight: 700; }
.batt { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--dim); }
.batt .bar { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.batt .bar b { display: block; height: 100%; background: var(--ok); }
.batt.low .bar b { background: var(--bad); }
/* ---- paired list ---- */
table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 14px; }
td { padding: 12px 12px; background: var(--card2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
td:first-child { border-inline-start: 1px solid var(--line); border-start-start-radius: 12px; border-end-start-radius: 12px; }
td:last-child { border-inline-end: 1px solid var(--line); border-start-end-radius: 12px; border-end-end-radius: 12px; }
td.r { text-align: end; }
td.r .acts { display: inline-flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
td.empty { background: none; border: 0; color: var(--dim); }
.combo { font-size: 12px; color: var(--dim); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.15); margin-inline-end: 8px; }
.dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
/* ---- guide ---- */
.tips { margin: 0 0 18px; padding-inline-start: 20px; color: #cfd3dc; }
.tips li { margin: 4px 0; }
.guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.gcard { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card2); }
.gcard h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.gcard p { margin: 0; color: #c4c9d3; font-size: 13px; }
.tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 2px 7px; border-radius: 6px; }
.tag.t { background: rgba(61,220,132,.15); color: var(--ok); }
.tag.b { background: rgba(255,138,0,.15); color: #ffb35c; }
.tag.x { background: rgba(255,255,255,.08); color: var(--dim); }
/* ---- dialog, log ---- */
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.dlg[hidden] { display: none; }
.dlg .box { background: #121217; border: 1px solid rgba(255,138,0,.5); border-radius: 18px; padding: 18px 20px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.dlg h3 { margin: 0 0 6px; font-size: 17px; color: var(--accent); }
.dlg .live { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; margin: 10px 0; }
.dlg .live span { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--accent-ink); }
.dlg .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.dlg .bar b { display: block; height: 100%; width: 0; background: var(--accent); }
.dlg .picked { font-weight: 700; margin: 8px 0 12px; min-height: 22px; }
.dlg .count button.on { background: var(--accent); border-color: var(--accent); color: #141414; font-weight: 700; }
.dlg .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
pre { margin: 12px 0 0; max-height: 360px; overflow: auto; font-size: 12px; color: #d8dbe2; direction: ltr; text-align: left;
  background: #0b0b0e; border: 1px solid var(--line); border-radius: 12px; padding: 12px; white-space: pre-wrap; }
.empty { color: var(--dim); font-size: 14px; padding: 6px 0; }
/* ---- narrow screens: the side bar becomes a top bar ---- */
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 12px; flex-direction: column; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav button { width: auto; flex: none; padding: 9px 12px; font-size: 12px; }
  .side .grow { display: none; }
  main { padding: 16px; }
  .pairbox { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .pairbox .row { justify-content: center; }
}
</style>
</head>

let L = TEXT.es, lang = "";
function setLang(code) {
  if (code === lang) return;
  lang = code;
  L = TEXT[code] || TEXT.en;
  document.documentElement.lang = code;
  document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
  for (const e of document.querySelectorAll("[data-t]")) {
    const v = L[e.dataset.t];
    if (typeof v !== "string") continue;
    if (e.dataset.html) e.innerHTML = v; else e.textContent = v;
  }
  if (!$("log").hidden) $("showlog").textContent = L.hidelog;
  renderGuide();
}
/* Pairing guide: how each kind of controller goes into pairing mode. */
function renderGuide() {
  const tips = $("tips"), g = $("guide");
  if (!tips || !g) return;
  tips.replaceChildren();
  for (const t of (L.tips || TEXT.en.tips)) { const li = el("li"); li.innerHTML = t; tips.appendChild(li); }
  g.replaceChildren();
  for (const [name, how, tag] of (L.guide || TEXT.en.guide)) {
    const c = el("div", "gcard"), h = el("h3");
    h.append(el("span", "", name), el("span", "tag " + tag, tag === "t" ? L.gt : tag === "b" ? L.gb : L.gx));
    c.append(h, el("p", "", how));
    g.appendChild(c);
  }
}
/* The side bar: one view at a time. */
function showView(v) {
  for (const b of document.querySelectorAll(".nav button")) b.classList.toggle("on", b.dataset.v === v);
  for (const sec of document.querySelectorAll(".view")) sec.hidden = sec.id !== "v-" + v;
  try { sessionStorage.setItem("whateverpad-view", v); } catch (e) {}
}
for (const b of document.querySelectorAll(".nav button")) b.onclick = () => showView(b.dataset.v);

const NAMES = { cross: "✕", circle: "○", square: "□", triangle: "△", l1: "L1", r1: "R1", l2: "L2", r2: "R2",
  l3: "L3", r3: "R3", up: "↑", down: "↓", left: "←", right: "→", options: "OPTIONS", create: "CREATE",
  ps: "PS", touchpad: "" };
async function api(method, path) {
  const r = await fetch(path, { method, headers: { "X-WhateverPad": "1" } });
  if (!r.ok) throw new Error("http " + r.status);
  return path === "/api/log" ? r.text() : r.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function stick(x, y) {
  const s = el("div", "stick"), d = el("i");
  d.style.left = (x / 255 * 100) + "%";
  d.style.top = (y / 255 * 100) + "%";
  s.appendChild(d);
  return s;
}

function trigger(v) {
  const t = el("div", "trig"), b = el("b");
  b.style.height = (v / 255 * 100) + "%";
  t.appendChild(b);
  return t;
}

function renderPads(pads) {
  const box = $("pads");
  box.replaceChildren();
  if (!pads.length) { box.appendChild(el("div", "empty", L.nopads)); return; }
  for (const p of pads) {
    const c = el("div", "pad"), top = el("div", "top"), ico = el("span", "ico");
    ico.innerHTML = PAD_SVG;
    top.append(ico, el("span", "name", modelName(p.vid, p.pid) === L.genericpad ? p.profile : modelName(p.vid, p.pid)), el("span", "slot", L.pl + p.slot));
    c.append(top, el("div", "meta", p.profile + " · " + p.addr));
    const viz = el("div", "viz");
    viz.append(trigger(p.l2), stick(p.lx, p.ly), stick(p.rx, p.ry), trigger(p.r2));
    c.appendChild(viz);
    const btns = el("div", "btns");
    for (const b of p.buttons) btns.appendChild(el("span", "", b === "touchpad" ? L.panel : (NAMES[b] || b)));
    c.appendChild(btns);
    if (p.battery >= 0) {
      const bat = el("div", "batt" + (p.battery <= 20 ? " low" : "")), bar = el("div", "bar"), fill = el("b");
      fill.style.width = p.battery + "%";
      bar.appendChild(fill);
      bat.append(el("span", "", L.battery), bar, el("span", "", p.battery + "%" + (p.charging ? " · " + L.charging : "")));
      c.appendChild(bat);
    }
    box.appendChild(c);
  }
}

function modelName(vid, pid) {
  if (vid === "0000" && pid === "0000") return L.unknownpad;
  return MODELS[vid + ":" + pid] || L.genericpad;
}
function renderPaired(list, pads) {
  const t = $("paired");
  t.replaceChildren();
  if (!list.length) { const r = t.insertRow(), d = r.insertCell(); d.className = "empty"; d.textContent = L.nopaired; return; }
  for (const p of list) {
    const r = t.insertRow(), a = r.insertCell(), b = r.insertCell(), c = r.insertCell();
    a.append(el("span", "dot" + (p.connected ? " on" : "")), document.createTextNode(p.addr));
    b.textContent = modelName(p.vid, p.pid) + (p.le ? " · LE" : "");
    b.title = p.vid + ":" + p.pid;          /* the id stays one hover away, for reports */
    c.className = "r";
    const live = (pads || []).find((x) => x.addr === p.addr);       /* connected: has a slot */
    const acts = el("span", "acts");
    c.appendChild(acts);
    if (live && !hasOwnPs(live)) {       /* PlayStation pads have their own PS button: neither shows */
      /* «Configure PS»: a combination of its buttons that stands for PS */
      if (live.pscombo) acts.appendChild(el("span", "combo", "PS = " + comboText(live.pscombo.split("+"))));
      const cf = el("button", "", L.psconf);
      cf.title = L.psconfhint;
      cf.onclick = () => openCombo(live, modelName(p.vid, p.pid));
      acts.appendChild(cf);
      const ps = el("button", "blue", L.pressps);
      ps.title = L.presspshint;
      ps.onclick = async () => { try { await api("POST", "/api/ps?slot=" + live.slot); } catch (e) {} };
      acts.appendChild(ps);
    }
    const f = el("button", "danger", L.forget);
    f.onclick = async () => {
      if (!confirm(L.forgetq(p.addr))) return;
      try { await api("POST", "/api/forget?addr=" + p.addr); } catch (e) {}
      refresh();
    };
    acts.appendChild(f);
  }
}

/* ---- «Configure PS» --------------------------------------------------------------- */
/* PlayStation pads have their own PS button: the setting is for the others. */
function hasOwnPs(p) { return /DualShock|DualSense/i.test(p.profile); }
const KEYS = ["l1", "r1", "l2", "r2", "l3", "r3", "cross", "circle", "square", "triangle",
  "up", "down", "left", "right", "options", "create", "touchpad"];
function keyName(k) { return k === "touchpad" ? L.panel : k === "options" ? "OPTIONS / START" : k === "create" ? "CREATE / SELECT" : (NAMES[k] || k); }
function comboText(keys) { return keys.map(keyName).join(" + "); }
let dlg = null;
/* The pressed buttons the setting can use (PS itself is not one of them). */
function showPicked() {
  $("dlgpicked").textContent = dlg.picked.length ? "PS = " + comboText(dlg.picked) : "";
  $("dlgsave").disabled = !dlg.count || dlg.picked.length !== dlg.count;
}
function setCount(n) {
  dlg.count = n;
  dlg.picked = [];
  dlg.held = "";
  for (const b of document.querySelectorAll("#dlgcount button")) b.classList.toggle("on", +b.dataset.n === n);
  $("dlgpress").textContent = n === 1 ? L.press1 : L.pressn(n);
  $("dlgbar").style.width = "0";
  showPicked();
}
async function openCombo(live, model) {
  const old = live.pscombo ? live.pscombo.split("+") : [];
  dlg = { slot: live.slot, old: live.pscombo || "", picked: old, count: old.length, held: "", since: 0, timer: 0 };
  $("dlgtitle").textContent = L.psconf + " · " + model + " (" + L.pl + live.slot + ")";
  for (const b of document.querySelectorAll("#dlgcount button")) b.classList.toggle("on", +b.dataset.n === dlg.count);
  $("dlgpress").textContent = !dlg.count ? L.pickcount : dlg.count === 1 ? L.press1 : L.pressn(dlg.count);
  $("dlgbar").style.width = "0";
  showPicked();
  $("dlg").hidden = false;
  try { await api("POST", "/api/pscombo?slot=" + live.slot + "&combo=capture"); } catch (e) {}
  dlg.timer = setInterval(watchCombo, 150);
}
/* Reads the pad: exactly the chosen number of buttons, held still for 1 s, is taken. */
async function watchCombo() {
  if (!dlg) return;
  let s;
  try { s = await api("GET", "/api/state"); } catch (e) { return; }
  if (!dlg) return;
  const p = (s.pads || []).find((x) => x.slot === dlg.slot);
  if (!p) { closeCombo(); return; }
  const now = p.buttons.filter((b) => KEYS.includes(b));
  const live = $("dlglive");
  live.replaceChildren();
  for (const b of now) live.appendChild(el("span", "", keyName(b)));
  const key = now.slice().sort().join("+");
  if (key !== dlg.held) { dlg.held = key; dlg.since = Date.now(); }
  const ok = dlg.count > 0 && now.length === dlg.count;
  const part = ok ? Math.min(1, (Date.now() - dlg.since) / 1000) : 0;
  $("dlgbar").style.width = (part * 100) + "%";
  if (ok && part >= 1 && key !== dlg.picked.slice().sort().join("+")) {
    dlg.picked = now;
    showPicked();
  }
}
function closeCombo() {
  if (dlg && dlg.timer) clearInterval(dlg.timer);
  dlg = null;
  $("dlg").hidden = true;
  refresh();
}
async function sendCombo(text) {
  try { await api("POST", "/api/pscombo?slot=" + dlg.slot + "&combo=" + text); } catch (e) {}
}
for (const b of document.querySelectorAll("#dlgcount button")) b.onclick = () => { if (dlg) setCount(+b.dataset.n); };
$("dlgsave").onclick = async () => { if (!dlg) return; await sendCombo(dlg.picked.join(",")); closeCombo(); };
$("dlgremove").onclick = async () => { if (!dlg) return; await sendCombo("none"); closeCombo(); };
$("dlgcancel").onclick = async () => {        /* the combination there was, or none */
  if (!dlg) return;
  await sendCombo(dlg.old ? dlg.old.split("+").join(",") : "none");
  closeCombo();
};

/* The radar: idle, searching (sweep and a bar for the search window), the
 * pause for the DualSense (blue), Bluetooth down (red). Bars instead of
 * seconds: the longest value seen is the full bar. */
let barMax = { search: 0, pause: 0 };
function radar(s) {
  const pause = Math.max(s.pairwait || 0, s.pause || 0);
  const mode = s.bluetooth === "failed" ? "fail" : pause > 0 ? "pause" : s.pairing > 0 ? "search" : "idle";
  const left = mode === "pause" ? pause : mode === "search" ? s.pairing : 0;
  $("radar").dataset.mode = mode;
  const st = $("pairstate");
  st.className = "pairstate " + mode;
  st.textContent = mode === "fail" ? L.btna : mode === "pause" ? L.radpause : mode === "search" ? L.radsearch
    : (s.pads && s.pads.length ? L.radpads(s.pads.length) : L.radidle);
  $("pairinfo").textContent = mode === "pause" ? L.radpausehint : mode === "search" ? L.radsearchhint : mode === "fail" ? "" : L.idle;
  const prog = $("prog");
  if (mode === "search" || mode === "pause") {
    if (left > barMax[mode]) barMax[mode] = left;
    prog.hidden = false;
    prog.className = "prog" + (mode === "pause" ? " pause" : "");
    $("progbar").style.width = Math.round((barMax[mode] - left + 1) / (barMax[mode] + 1) * 100) + "%";
  } else {
    barMax = { search: 0, pause: 0 };
    prog.hidden = true;
  }
  const blips = $("blips");
  blips.replaceChildren();
  (s.pads || []).forEach((p, i) => {
    const a = (i * 97 + 30) * Math.PI / 180, r = 34;
    const b = el("i", "blip");
    b.style.left = (50 + r * Math.cos(a)) + "%";
    b.style.top = (50 + r * Math.sin(a)) + "%";
    blips.appendChild(b);
  });
  $("chip").textContent = s.chip ? "Bluetooth: " + s.chip : "";
}

async function refresh() {
  try {
    const s = await api("GET", "/api/state");
    setLang(TEXT[s.lang] ? s.lang : "en");
    $("ver").textContent = s.version;
    $("status").textContent = s.running ? L.running : L.nobt;
    $("status").className = s.running ? "on" : "off";
    radar(s);
    $("btfail").hidden = s.bluetooth !== "failed";
    $("btreason").textContent = s.reason || "";
    if (s.bluetooth === "trying") $("status").textContent = L.starting;
    $("pair").disabled = s.pairing > 0 || s.pairwait > 0 || s.bluetooth !== "ok";
    renderPads(s.pads);
    renderPaired(s.paired, s.pads);
  } catch (e) {
    $("status").textContent = L.offline;
    $("status").className = "off";
  }
}

$("retry").onclick = async () => { try { await api("POST", "/api/retry"); } catch (e) {} refresh(); };
$("pair").onclick = async () => { try { await api("POST", "/api/pair"); } catch (e) {} refresh(); };
$("exit").onclick = () => {
  /* Only leaves the page: WhateverPad PS5 keeps running. Browsers refuse to close a page they did
     not open from a script, so fall back to going back, then say how to leave. */
  try { window.close(); } catch (e) {}
  setTimeout(() => { if (history.length > 1) history.back(); }, 250);
  setTimeout(() => { $("exithint").textContent = L.exitfail; }, 800);
};
$("stop").onclick = async () => {
  if (!confirm(L.stopq)) return;
  try { await api("POST", "/api/stop"); } catch (e) {}
  $("status").textContent = L.stopping;
};
$("showlog").onclick = async () => {
  const pre = $("log");
  if (!pre.hidden) { pre.hidden = true; $("showlog").textContent = L.showlog; return; }
  try { pre.textContent = await api("GET", "/api/log"); } catch (e) { return; }
  pre.hidden = false;
  pre.scrollTop = pre.scrollHeight;
  $("showlog").textContent = L.hidelog;
};

try { const v = sessionStorage.getItem("whateverpad-view"); if (v && $("v-" + v)) showView(v); } catch (e) {}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
